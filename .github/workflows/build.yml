name: Build CorgiCoin

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# the default token only needs to read the repository: no job here publishes anything
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y \
            build-essential \
            cmake \
            libboost-all-dev \
            libssl-dev \
            libdb++-dev \
            libminiupnpc-dev \
            libzmq3-dev \
            python3-zmq

      - name: Build LevelDB (the pinned release, static, the same on every platform)
        run: contrib/build-leveldb.sh "$HOME/leveldb"

      - name: Build daemon
        run: |
          mkdir build && cd build
          # ZeroMQ is opt-in; turn it on here so feature_zmq.py runs instead of skipping
          # a wrong printf format in a log line is a build error here (-DENABLE_WERROR_FORMAT)
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_GUI=OFF -DBUILD_TESTS=ON -DUSE_ZMQ=ON -DENABLE_WERROR_FORMAT=ON -DLEVELDB_INCLUDE_DIR=$HOME/leveldb/include -DLEVELDB_LIBRARY=$HOME/leveldb/lib/libleveldb.a
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./test_corgicoin

      - name: Fetch the last release (the second build for feature_cross_binary.py)
        run: |
          # update the version and the checksum (SHA256SUMS of the release) with each release
          curl -fsSL -o prev.tar.gz https://github.com/corgicoin/corgicoin/releases/download/v4.9.0.0/corgicoin-v4.9.0.0-linux-x64.tar.gz
          echo "611280688d03f440946d124123ba3105c675edb69b5b87416fa9afb2f24611c9  prev.tar.gz" | sha256sum -c -
          mkdir prev && tar xzf prev.tar.gz -C prev

      - name: Run functional tests (regtest)
        run: CORGICOIND_ALT="$PWD/prev/corgicoin-v4.9.0.0-linux-x64/corgicoind" python3 test/functional/test_runner.py --corgicoind build/corgicoind

      - name: Upload Linux daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-linux-x64
          path: build/corgicoind

  sanitizers:
    # Unit tests under AddressSanitizer (memory errors, leaks), UBSan (undefined behaviour) and the
    # standard library's assertions (-D_GLIBCXX_ASSERTIONS), which stop on out-of-range vector access
    # that UBSan alone cannot see. UBSan is built with -fno-sanitize-recover so any report fails the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y             build-essential             cmake             libboost-all-dev             libssl-dev             libdb++-dev             libminiupnpc-dev

      - name: Build LevelDB (the pinned release, static, the same on every platform)
        run: contrib/build-leveldb.sh "$HOME/leveldb"

      - name: Build unit tests with sanitizers
        run: |
          mkdir build-san && cd build-san
          # vptr is off: the pinned LevelDB is built without RTTI (as its own CMake asks), and vptr checks need the typeinfo of the classes it declares
          SAN="-fsanitize=address,undefined -fno-sanitize=vptr -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -D_GLIBCXX_ASSERTIONS"
          cmake .. -DCMAKE_BUILD_TYPE=Debug             -DCMAKE_CXX_FLAGS="$SAN" -DCMAKE_C_FLAGS="$SAN" -DCMAKE_EXE_LINKER_FLAGS="$SAN"             -DBUILD_QT_GUI=OFF -DBUILD_TESTS=ON -DLEVELDB_INCLUDE_DIR=$HOME/leveldb/include -DLEVELDB_LIBRARY=$HOME/leveldb/lib/libleveldb.a
          make -j$(nproc) test_corgicoin corgicoind

      - name: Run unit tests under the sanitizers
        run: |
          cd build-san
          # DoS_checkSig asserts on wall-clock timing (cached vs. uncached signature checks), which an
          # instrumented build makes unreliable: it fails about half the time even on unmodified master.
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 ./test_corgicoin --run_test='!DoS_tests/DoS_checkSig'

      - name: Run the functional tests under the sanitizers
        run: |
          # The node's stderr is kept by the test framework, and a test fails on "runtime error:" (UBSan) or
          # "AddressSanitizer" in it, and on a node that does not stop cleanly. Leak detection is off for the daemon: it
          # ends with _Exit after a clean shutdown (no static destructors run), so what is still allocated then is not a leak.
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=0 UBSAN_OPTIONS=print_stacktrace=1
          python3 test/functional/test_runner.py --corgicoind build-san/corgicoind -j 2

  build-macos:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install boost openssl@3 berkeley-db miniupnpc cmake zeromq
          python3 -m pip install --break-system-packages pyzmq==26.4.0

      - name: Build LevelDB (the pinned release, static, the same on every platform)
        run: contrib/build-leveldb.sh "$HOME/leveldb"

      - name: Build daemon
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DUSE_ZMQ=ON \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DLEVELDB_INCLUDE_DIR=$HOME/leveldb/include \
            -DLEVELDB_LIBRARY=$HOME/leveldb/lib/libleveldb.a \
            -DBerkeleyDB_ROOT=$(brew --prefix berkeley-db)
          make -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        run: |
          cd build
          ./test_corgicoin

      - name: Fetch the last release (the second build for feature_cross_binary.py)
        run: |
          # update the version and the checksum (SHA256SUMS of the release) with each release
          curl -fsSL -o prev.tar.gz https://github.com/corgicoin/corgicoin/releases/download/v4.9.0.0/corgicoin-v4.9.0.0-macos-arm64.tar.gz
          echo "011e991a69f27fc0e6c930fb86dba3840df01e76caa59f5af0c582ec0ac554bb  prev.tar.gz" | shasum -a 256 -c -
          mkdir prev && tar xzf prev.tar.gz -C prev

      - name: Run functional tests (regtest)
        run: CORGICOIND_ALT="$PWD/prev/corgicoin-v4.9.0.0-macos-arm64/corgicoind" python3 test/functional/test_runner.py --corgicoind build/corgicoind

      - name: Bundle its libraries (runs on a Mac without Homebrew)
        run: |
          python3 contrib/macdeploy/bundle_macos.py daemon build/corgicoind dist
          set -- dist/corgicoind
          # Start it (-? prints help and exits) with dyld listing every image it loads: none may come from Homebrew,
          # and its libraries must come from dist/lib
          DYLD_PRINT_LIBRARIES=1 "$1" -datadir="$(mktemp -d)" -? 2> dyld.log >/dev/null || true
          if grep -E "/opt/homebrew|/usr/local" dyld.log; then echo "loads libraries from outside the bundle"; exit 1; fi
          grep -q "dist/lib/libssl.3.dylib" dyld.log || { echo "bundled libssl not loaded:"; cat dyld.log; exit 1; }
          echo "loaded $(grep -c 'dist/lib/' dyld.log) bundled libraries"

      - name: Upload macOS daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-macos-arm64
          path: build/corgicoind

  build-macos-qt:
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install boost openssl@3 berkeley-db miniupnpc cmake qt

      - name: Build LevelDB (the pinned release, static, the same on every platform)
        run: contrib/build-leveldb.sh "$HOME/leveldb"

      - name: Build Qt wallet
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=ON \
            -DBUILD_TESTS=OFF \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DLEVELDB_INCLUDE_DIR=$HOME/leveldb/include \
            -DLEVELDB_LIBRARY=$HOME/leveldb/lib/libleveldb.a \
            -DBerkeleyDB_ROOT=$(brew --prefix berkeley-db)
          make -j$(sysctl -n hw.logicalcpu) corgicoin-qt

      - name: Bundle Qt and every library into the app
        run: |
          mkdir -p dist
          mv build/corgicoin-qt.app dist/CorgiCoin-Qt.app
          $(brew --prefix qt)/bin/macdeployqt dist/CorgiCoin-Qt.app -always-overwrite || true
          python3 contrib/macdeploy/bundle_macos.py app dist/CorgiCoin-Qt.app

  build-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW cross-compiler and dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y \
            g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-x86-64-posix \
            mingw-w64-x86-64-dev \
            cmake \
            curl \
            bzip2 \
            pkg-config \
            autoconf \
            automake \
            libtool
          # Ensure posix threading model is selected
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 2>/dev/null || true

      - name: Build dependencies from source
        run: |
          mkdir -p /tmp/deps/install
          export HOST=x86_64-w64-mingw32
          export PREFIX=/tmp/deps/install

          # Boost
          cd /tmp/deps
          curl -fsSL https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2 | tar xj
          cd boost_1_84_0
          echo "using gcc : mingw : x86_64-w64-mingw32-g++ ;" > user-config.jam
          ./bootstrap.sh --without-icu
          ./b2 --user-config=user-config.jam toolset=gcc-mingw target-os=windows address-model=64 \
            variant=release link=static threading=multi \
            --with-filesystem --with-program_options --with-thread --with-system --with-date_time \
            --prefix=$PREFIX install -j$(nproc) 2>&1 | tail -5

          # OpenSSL
          cd /tmp/deps
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz | tar xz
          cd openssl-3.3.2
          ./Configure mingw64 no-shared --cross-compile-prefix=x86_64-w64-mingw32- --prefix=$PREFIX
          make -j$(nproc) 2>&1 | tail -3
          make install_sw 2>&1 | tail -3

          # Berkeley DB 4.8 (cross-compiles cleanly with MinGW, unlike 5.3)
          cd /tmp/deps
          curl -fsSL https://download.oracle.com/berkeley-db/db-4.8.30.tar.gz | tar xz
          cd db-4.8.30/build_unix
          # Patch: fix WinIoCtl.h case sensitivity for MinGW
          sed -i 's/WinIoCtl.h/winioctl.h/g' ../src/dbinc/win_db.h 2>/dev/null || true
          ../dist/configure --host=x86_64-w64-mingw32 --enable-cxx --enable-mingw --disable-replication --prefix=$PREFIX
          make -j$(nproc) || true
          # Install just the libraries and headers (utilities fail to cross-compile, that's OK)
          mkdir -p $PREFIX/include $PREFIX/lib
          cp db.h db_cxx.h db_config.h $PREFIX/include/
          cp .libs/libdb-4.8.a $PREFIX/lib/
          cp .libs/libdb_cxx-4.8.a $PREFIX/lib/
          ln -sf libdb_cxx-4.8.a $PREFIX/lib/libdb_cxx.a
          ln -sf libdb-4.8.a $PREFIX/lib/libdb.a

          # Verify BDB installed correctly
          echo "=== BDB installation ==="
          ls -la $PREFIX/include/db_cxx.h || (echo "FATAL: db_cxx.h not found!" && exit 1)
          ls -la $PREFIX/lib/libdb_cxx*.a || (echo "FATAL: libdb_cxx not found!" && exit 1)

      - name: Build LevelDB for Windows (the pinned release, cross-compiled)
        run: |
          contrib/build-leveldb.sh /tmp/deps/install \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++

      - name: Build CorgiCoin for Windows
        run: |
          export PREFIX=/tmp/deps/install
          mkdir build-win && cd build-win
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_FIND_ROOT_PATH=$PREFIX \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DUSE_UPNP=OFF \
            -DOPENSSL_ROOT_DIR=$PREFIX \
            -DBERKELEYDB_INCLUDE_DIR=$PREFIX/include \
            -DBERKELEYDB_LIBRARY=$PREFIX/lib/libdb_cxx.a \
            -DLEVELDB_INCLUDE_DIR=$PREFIX/include \
            -DLEVELDB_LIBRARY=$PREFIX/lib/libleveldb.a \
            -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES=$PREFIX/include \
            -DBoost_ROOT=$PREFIX \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          make -j$(nproc)

      - name: Upload Windows daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-windows-x64
          path: build-win/corgicoind.exe

  build-windows-qt:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-db
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zeromq
            make

      - name: Build LevelDB (the pinned release, static)
        run: contrib/build-leveldb.sh "$HOME/leveldb" -G "MSYS Makefiles"

      - name: Build daemon and Qt wallet
        run: |
          mkdir build && cd build
          cmake .. \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=ON \
            -DBUILD_TESTS=OFF \
            -DUSE_UPNP=OFF \
            -DUSE_ZMQ=ON \
            -DLEVELDB_INCLUDE_DIR=$HOME/leveldb/include \
            -DLEVELDB_LIBRARY=$HOME/leveldb/lib/libleveldb.a
          make -j$(nproc)

      - name: Build the last release (the second build for feature_cross_binary.py)
        run: |
          # from source, not the released daemon: that one is cross-built with Berkeley DB 4.8, and a data directory written by this build's
          # (newer) Berkeley DB cannot be opened by it. Update the tag with each release.
          mkdir ../prev && curl -fsSL https://github.com/corgicoin/corgicoin/archive/refs/tags/v4.9.0.0.tar.gz | tar xz -C ../prev --strip-components=1
          mkdir ../prev/build && cd ../prev/build
          cmake .. -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_GUI=OFF -DBUILD_TESTS=OFF -DUSE_UPNP=OFF
          make -j$(nproc) corgicoind

      - name: Run functional tests (regtest) on Windows
        run: |
          # MSYS2 has no pyzmq package for the MINGW64 environment (only for UCRT64 and the clang ones), and feature_zmq.py must not be skipped:
          # it is built from source against MSYS2's libzmq. (The Windows Python runs these tests about ten times slower.)
          python3 -m pip install --break-system-packages pyzmq==26.4.0
          CORGICOIND_ALT="$PWD/../prev/build/corgicoind.exe" python3 test/functional/test_runner.py --corgicoind build/corgicoind.exe -j 2

      - name: Upload Windows Qt wallet
        uses: actions/upload-artifact@v4
        with:
          name: corgicoin-qt-windows-x64
          path: build/corgicoin-qt.exe

      - name: Upload Windows daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-msys2-windows-x64
          path: build/corgicoind.exe
