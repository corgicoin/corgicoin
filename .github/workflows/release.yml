name: Release CorgiCoin

# Builds all platform binaries and attaches them to a GitHub Release
# whenever a version tag (v*) is pushed, e.g.:
#   git tag v4.2.0.0 && git push origin v4.2.0.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-all-dev \
            libssl-dev \
            libdb++-dev \
            libminiupnpc-dev

      - name: Build daemon
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_GUI=OFF -DBUILD_TESTS=ON
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./test_corgicoin

      - name: Upload Linux daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-linux-x64
          path: build/corgicoind

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install boost openssl@3 berkeley-db miniupnpc cmake

      - name: Build daemon
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
            -DBerkeleyDB_ROOT=$(brew --prefix berkeley-db)
          make -j$(sysctl -n hw.logicalcpu)

      - name: Run tests
        run: |
          cd build
          ./test_corgicoin

      - name: Upload macOS daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-macos-arm64
          path: build/corgicoind

  build-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW cross-compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-x86-64-posix \
            mingw-w64-x86-64-dev \
            cmake \
            curl \
            bzip2 \
            pkg-config \
            autoconf \
            automake \
            libtool
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix 2>/dev/null || true
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix 2>/dev/null || true

      - name: Build dependencies from source
        run: |
          mkdir -p /tmp/deps/install
          export HOST=x86_64-w64-mingw32
          export PREFIX=/tmp/deps/install

          # Boost
          cd /tmp/deps
          curl -sL https://archives.boost.io/release/1.84.0/source/boost_1_84_0.tar.bz2 | tar xj
          cd boost_1_84_0
          echo "using gcc : mingw : x86_64-w64-mingw32-g++ ;" > user-config.jam
          ./bootstrap.sh --without-icu
          ./b2 --user-config=user-config.jam toolset=gcc-mingw target-os=windows address-model=64 \
            variant=release link=static threading=multi \
            --with-filesystem --with-program_options --with-thread --with-system --with-date_time \
            --prefix=$PREFIX install -j$(nproc) 2>&1 | tail -5

          # OpenSSL
          cd /tmp/deps
          curl -sL https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz | tar xz
          cd openssl-3.3.2
          ./Configure mingw64 no-shared --cross-compile-prefix=x86_64-w64-mingw32- --prefix=$PREFIX
          make -j$(nproc) 2>&1 | tail -3
          make install_sw 2>&1 | tail -3

          # Berkeley DB 4.8 (cross-compiles cleanly with MinGW, unlike 5.3)
          cd /tmp/deps
          curl -sL https://download.oracle.com/berkeley-db/db-4.8.30.tar.gz | tar xz
          cd db-4.8.30/build_unix
          sed -i 's/WinIoCtl.h/winioctl.h/g' ../src/dbinc/win_db.h 2>/dev/null || true
          ../dist/configure --host=x86_64-w64-mingw32 --enable-cxx --enable-mingw --disable-replication --prefix=$PREFIX
          make -j$(nproc) || true
          mkdir -p $PREFIX/include $PREFIX/lib
          cp db.h db_cxx.h db_config.h $PREFIX/include/
          cp .libs/libdb-4.8.a $PREFIX/lib/
          cp .libs/libdb_cxx-4.8.a $PREFIX/lib/
          ln -sf libdb_cxx-4.8.a $PREFIX/lib/libdb_cxx.a
          ln -sf libdb-4.8.a $PREFIX/lib/libdb.a
          ls -la $PREFIX/include/db_cxx.h || (echo "FATAL: db_cxx.h not found!" && exit 1)
          ls -la $PREFIX/lib/libdb_cxx*.a || (echo "FATAL: libdb_cxx not found!" && exit 1)

      - name: Build CorgiCoin for Windows
        run: |
          export PREFIX=/tmp/deps/install
          mkdir build-win && cd build-win
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_FIND_ROOT_PATH=$PREFIX \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DUSE_UPNP=OFF \
            -DOPENSSL_ROOT_DIR=$PREFIX \
            -DBERKELEYDB_INCLUDE_DIR=$PREFIX/include \
            -DBERKELEYDB_LIBRARY=$PREFIX/lib/libdb_cxx.a \
            -DCMAKE_CXX_STANDARD_INCLUDE_DIRECTORIES=$PREFIX/include \
            -DBoost_ROOT=$PREFIX \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          make -j$(nproc)

      - name: Upload Windows daemon
        uses: actions/upload-artifact@v4
        with:
          name: corgicoind-windows-x64
          path: build-win/corgicoind.exe

  build-windows-qt:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-db
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-miniupnpc
            make

      - name: Build daemon and Qt wallet
        run: |
          mkdir build && cd build
          cmake .. \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_QT_GUI=ON \
            -DBUILD_TESTS=OFF \
            -DUSE_UPNP=OFF
          make -j$(nproc)

      - name: Bundle Qt wallet with runtime DLLs
        run: |
          mkdir -p dist
          cp build/corgicoin-qt.exe dist/
          # Qt platform/plugin DLLs
          windeployqt6 --release --no-translations dist/corgicoin-qt.exe
          # MinGW runtime + library DLLs (boost, openssl, bdb, etc.)
          for dll in $(ldd dist/corgicoin-qt.exe | grep -i mingw64 | awk '{print $3}'); do
            cp -n "$dll" dist/ || true
          done
          ls dist/

      - name: Upload Windows Qt wallet bundle
        uses: actions/upload-artifact@v4
        with:
          name: corgicoin-qt-windows-x64
          path: dist/

  release:
    needs: [build-linux, build-macos, build-windows, build-windows-qt]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release archives
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p out

          package() {
            # package <artifact-dir> <archive-name> <format> <files...>
            local dir="$1" name="$2" fmt="$3"; shift 3
            mkdir -p "stage/$name"
            for f in "$@"; do cp -r "artifacts/$dir/$f" "stage/$name/"; done
            cp contrib/corgicoin.conf.example "stage/$name/"
            cp doc/mining.md "stage/$name/MINING.md"
            if [ "$fmt" = "zip" ]; then
              (cd stage && zip -rq "../out/$name.zip" "$name")
            else
              tar -czf "out/$name.tar.gz" -C stage "$name"
            fi
          }

          chmod +x artifacts/corgicoind-linux-x64/corgicoind artifacts/corgicoind-macos-arm64/corgicoind

          package corgicoind-linux-x64   "corgicoin-$VERSION-linux-x64"   tar corgicoind
          package corgicoind-macos-arm64 "corgicoin-$VERSION-macos-arm64" tar corgicoind
          package corgicoind-windows-x64 "corgicoin-$VERSION-windows-x64" zip corgicoind.exe

          # Qt wallet bundle is a directory tree (exe + DLLs + Qt plugins)
          mkdir -p "stage/corgicoin-qt-$VERSION-windows-x64"
          cp -r artifacts/corgicoin-qt-windows-x64/. "stage/corgicoin-qt-$VERSION-windows-x64/"
          cp contrib/corgicoin.conf.example "stage/corgicoin-qt-$VERSION-windows-x64/"
          (cd stage && zip -rq "../out/corgicoin-qt-$VERSION-windows-x64.zip" "corgicoin-qt-$VERSION-windows-x64")

          (cd out && sha256sum * > SHA256SUMS)
          ls -la out/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "CorgiCoin $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Binaries for Linux (x64), macOS (arm64), and Windows (x64 daemon + Qt wallet). Verify downloads against SHA256SUMS. See MINING.md inside each archive (or doc/mining.md) to get started."
